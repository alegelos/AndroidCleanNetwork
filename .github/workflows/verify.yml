name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also requests the retired SDK package "tools".
          packages: 'platform-tools'

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build, test, lint, and verify publishing
        run: ./gradlew clean test lint publishToMavenLocal --no-daemon

      - name: Build, test, and lint the consumer example
        env:
          ANDROID_CLEAN_NETWORK_PATH: ${{ github.workspace }}
        run: >-
          ./gradlew -p skills/androidcleannetwork/assets/UserExample
          :user-domain:build :user-data:testDebugUnitTest
          :user-data:lintDebug :user-data:assembleDebug --no-daemon

      - name: Verify skill installation and portable references
        run: python3 -m unittest discover -s scripts/tests -v
